# ~/.tmux.conf - Clean, minimal tmux configuration
# Focused on seamless clipboard sharing, mouse support, and fast pane navigation

# --- General Settings ---
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 0           # Zero delay on Esc (essential for Neovim)
set -g history-limit 50000     # Ample scrollback buffer
set -g base-index 1            # Windows start at 1 instead of 0
setw -g pane-base-index 1      # Panes start at 1 instead of 0
set -g renumber-windows on     # Renumber windows automatically when one is closed

# --- Mouse Support ---
set -g mouse on                # Click panes, resize splits, scroll through output

# --- Intuitive Split Keys ---
# Open new panes in the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Fast Pane Navigation (Vim-style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane Resizing (Alt + Arrow Keys) ---
bind -n M-Left  resize-pane -L 3
bind -n M-Right resize-pane -R 3
bind -n M-Up    resize-pane -U 2
bind -n M-Down  resize-pane -D 2

# --- Clipboard Integration (xclip) ---
# Use Vi keys in buffer / copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection

# Copy to X11 clipboard on 'y' or mouse drag release
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Paste from X11 clipboard via Prefix + P
bind P run "xclip -out -selection clipboard | tmux load-buffer - && tmux paste-buffer"

# --- Status Bar (Minimal, Dark Theme) ---
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bold] [#S] "
set -g status-right-length 60
set -g status-right "#[fg=#a6adc8]%Y-%m-%d #[fg=#cdd6f4]| #[fg=#a6e3a1]%H:%M "

# Active / Inactive window styles
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "

# Clean pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Quick reload config with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
